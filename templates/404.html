{% extends "base.html" %}
{% block content %}
<section class="error-page">
  <div class="section-inner section-inner--narrow error-page__inner">
    <span class="error-page__code">404</span>
    <h1 class="section-heading">This page doesn't exist.</h1>
    <p>The page you're looking for may have moved. Head back to the homepage to keep going.</p>
    <a href="{{ url_for('index') }}" class="btn btn--primary">Back to Home</a>
  </div>
</section>
{% endblock %}
