{% extends "base.html" %}
{% block content %}
<section class="error-page">
  <div class="section-inner section-inner--narrow error-page__inner">
    <span class="error-page__code">500</span>
    <h1 class="section-heading">Something went wrong on our end.</h1>
    <p>We've logged the issue. Please try again shortly, or reach us directly at {{ company.email }}.</p>
    <a href="{{ url_for('index') }}" class="btn btn--primary">Back to Home</a>
  </div>
</section>
{% endblock %}
